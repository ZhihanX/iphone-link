name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Page tests
        run: node --test "test/*.test.js"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Name the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/iphone-link.exe out/iPhoneLink.exe
          (Get-FileHash out/iPhoneLink.exe -Algorithm SHA256).Hash.ToLower() + "  iPhoneLink.exe" | Out-File -Encoding ascii out/iPhoneLink.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: iPhoneLink-windows
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/iPhoneLink.exe
            out/iPhoneLink.exe.sha256
          generate_release_notes: true
